---
name: main

on:
  push:
    branches: [ v1, v2, v3 ]
  pull_request:
    branches: [ v1, v2, v3 ]

jobs:
  build:
    name: Build
    if: "!contains(github.event.commits[0].message, 'ci skip')"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version: 1.26.x
      id: go

    - name: 'Run tests'
      run: |
        go test -v ./...

    - name: 'Build samples'
      run: |
        ROOTDIR=$PWD
        cd examples/aws/
        go build -v
        cd $ROOTDIR/
        cd examples/gcp/
        go build -v
